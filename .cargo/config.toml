[target.x86_64-unknown-linux-gnu]
# Use mold for the final link (installed user-locally at ~/.local/bin/mold).
# Speeds up the link step significantly on this large, LTO-optimized binary.
rustflags = [
    "-C", "link-arg=-fuse-ld=mold"
]
[target.x86_64-pc-windows-msvc]
# Increase default stack size to avoid running out of stack
# space in debug builds. The size matches Linux's default.
rustflags = [
    "-C", "link-arg=/STACK:8000000"
]
[target.aarch64-pc-windows-msvc]
# Increase default stack size to avoid running out of stack
# space in debug builds. The size matches Linux's default.
rustflags = [
    "-C", "link-arg=/STACK:8000000"
]
