[workspace]
resolver = "3"
members = [
    "crates/ui-lib",
    "crates/desktop-app",
    "crates/voice-capture",
    "crates/examples-runner",
    "crates/beca-core",
    "crates/beca-apps",
    "crates/beca",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
slint = "1.18.1"
slint-build = "1.18.1"
cpal = "0.15"
clap = { version = "4", features = ["derive", "env"] }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
ureq = "2"
mlua = { version = "0.10", features = ["lua54", "vendored"] }

[profile.release]
codegen-units = 1
lto = true
