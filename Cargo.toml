[workspace]
resolver = "3"
members = [
    "crates/beca-bar",
    "crates/beca-cli",
    "crates/beca-core",
    "crates/beca-daemon",
    "crates/beca-process",
    "crates/beca-voice",
    "crates/beca-launcher",
    "crates/beca-apps",
    "crates/beca-ui",
    "crates/beca-ui-catalog",
    "crates/beca-panel",
    "crates/beca-layer-shell",
    "crates/beca-widgets",
]

default-members = ["crates/beca-cli"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit-wayland", "renderer-software", "compat-1-2"] }
slint-build = "1.18.1"
slint-interpreter = { version = "1.18.1", default-features = false, features = ["std", "backend-winit-wayland", "renderer-software", "compat-1-2"] }
cpal = "0.15"
clap = { version = "4", features = ["derive", "env"] }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
ureq = "2"
mlua = { version = "0.10", features = ["lua54", "vendored"] }

[profile.release]
# Dev-fast release: much quicker to build; thin LTO keeps most of the perf.
# For final packaging (e.g. install): 
#   cargo build --release --config profile.release.lto=full --config profile.release.codegen-units=1
codegen-units = 16
lto = "thin"

[profile.dev]
# Workspace code keeps opt-level 1 for interactive Slint; dependencies stay unoptimized.
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 0
debug = false

# Full debug info on demand: cargo build --profile debugging -p beca-cli
[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = 2
