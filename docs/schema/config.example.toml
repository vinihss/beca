# Beca — main config (XDG)
# Location: $XDG_CONFIG_HOME/beca/config.toml  (default: ~/.config/beca/config.toml)
# Precedence: CLI flags > environment variables > config.toml > built-in defaults

[core]
# Active theme (file name in themes/<name>.toml or "default")
theme = "default"
# Log level: error|warn|info|debug
log_level = "info"

[shell]
# Hyprland/Wayland integration (reserved for shell modules)
# e.g.: layer, anchor, exclusivity — defined per module when applicable

[modules.voice]
# Capture/transcription module (beca-ui component: VoiceCaptureWindow)
enabled = true
daemon_url = "http://127.0.0.1:4100"   # override: env VOICE_DAEMON_URL
# default mode: "pipe" (stdout+exit, Hyprland binds compatible) | "hold" (UI with result)
mode = "pipe"
prefer_sample_rate = 16000
channels = 1
# Lua behavior script (optional, disk override; embedded fallback)
# script = "scripts/voice.lua"          # relative to $XDG_CONFIG_HOME/beca/
# Respond via LLM and speak via TTS after transcription (assistant/kokoro flow)
respond = true
# Optional shell commands: stdout = answer; $TRANSCRIPT/$TEXT available
# respond_command = "..."
# tts_command = "..."

[modules.voice.ui]
# UI/params overrides without recompiling (injected as props)
title = "Voice Capture"
status_recording = "Recording..."
status_transcribing = "Transcribing..."
status_responding = "Thinking..."
status_speaking = "Speaking..."

# [modules.launcher]
# enabled = true

# Bars are configured per position. Supported positions: top | bottom.
# Widget lists use three sessions: begin | center | end.
# Supported widgets: launcher, clock, conversation, volume-out, volume-in,
# network, alerts, bluetooth, cpu, memory, disk.
# Omitting all three lists keeps the position defaults; providing at least one
# list makes the omitted ones empty.

[bar.top]
enabled = true
height = 34.0
background_opacity = 1.0
# Reserve space (exclusive zone/struts) so tiled windows don't overlap the bar
exclusive = true
show_border = false
# background = "#2D2D2D"
begin_align = "start"     # start | center | end
center_align = "center"   # start | center | end
end_align = "end"         # start | center | end
begin = ["cpu", "memory", "disk"]
center = ["clock", "conversation", "alerts"]
end = ["bluetooth"]

[bar.bottom]
enabled = true
height = 34.0
background_opacity = 1.0
exclusive = true
show_border = false
# background = "#2D2D2D"
begin_align = "start"     # start | center | end
center_align = "center"   # start | center | end
end_align = "end"         # start | center | end
begin = ["launcher"]
center = []
end = ["volume-out", "volume-in", "network"]

# Widget-specific settings are global (shared by all bars).

[widget.clock]
format = "%H:%M"

[widget.launcher]
label = "Apps"
