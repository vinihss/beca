# Beca — theme (runtime, no recompile)
# Location: $XDG_CONFIG_HOME/beca/themes/<name>.toml
# Tokens are injected into the Theme global properties (beca-ui) at startup.
# Requires the Theme tokens to be runtime-settable (in-out/in) — an implementation detail.

[meta]
name = "default"
variant = "dark" # dark | light

[colors]
# map to Theme: background, text-main, card-bg, card-border, accent, etc.
background = "#1E1E1E"
text_main = "#FFFFFF"
text_strong = "#FFFFFF"
card_bg = "#2D2D2D"
card_border = "#3F3F3F"
surface = "#2D2D2D"
surface_alt = "#131522"
border = "#3F3F3F"
accent = "#007ACC"
accent_success = "#2f6f4f"
accent_danger = "#a04040"
recording = "#f7768e"

[metrics]
# radius/spacing (px) — as exposed by the Theme tokens
radius = 6
